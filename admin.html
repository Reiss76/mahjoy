<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — MAH JOY</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <style>
    :root {
      --burgundy: #722F37;
      --orchid: #89688b;
      --blush: #fdf8fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f5; min-height: 100vh; }
    
    /* Login */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .login-box {
      background: #fff; padding: 2.5rem; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1); max-width: 360px; width: 100%;
    }
    .login-box h1 { font-size: 1.5rem; color: var(--burgundy); margin-bottom: 1.5rem; text-align: center; }
    .login-box input {
      width: 100%; padding: 1rem; border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: 1rem; margin-bottom: 1rem;
    }
    .login-box input:focus { outline: none; border-color: var(--burgundy); }
    .login-box button {
      width: 100%; padding: 1rem; background: var(--burgundy); color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    .login-box button:hover { opacity: .9; }
    .login-error { color: #c00; font-size: .85rem; margin-bottom: 1rem; display: none; }
    
    /* Admin Panel */
    #admin-panel { display: none; }
    .admin-header {
      background: var(--burgundy); color: #fff; padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .admin-header h1 { font-size: 1.2rem; font-weight: 600; }
    .admin-header button {
      background: rgba(255,255,255,.2); border: none; color: #fff;
      padding: .5rem 1rem; border-radius: 6px; cursor: pointer; font-size: .85rem;
    }
    
    .admin-content { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    
    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem; margin-bottom: 2rem;
    }
    .stat-card {
      background: #fff; padding: 1.5rem; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .stat-card .label { font-size: .75rem; color: #888; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--burgundy); margin-top: .25rem; }
    
    .orders-section h2 { font-size: 1rem; color: #333; margin-bottom: 1rem; }
    
    .order-card {
      background: #fff; border-radius: 12px; margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden;
    }
    .order-header {
      padding: 1rem 1.5rem; background: var(--blush);
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
    }
    .order-header:hover { background: #f5eef3; }
    .order-id { font-weight: 700; color: var(--burgundy); }
    .order-date { font-size: .85rem; color: #888; }
    .order-status {
      padding: .25rem .75rem; border-radius: 20px; font-size: .75rem; font-weight: 600;
    }
    .order-status.paid { background: #d4edda; color: #155724; }
    .order-status.pending { background: #fff3cd; color: #856404; }
    .order-status.shipped { background: #cce5ff; color: #004085; }
    
    .order-detail { display: none; padding: 1.5rem; border-top: 1px solid #eee; }
    .order-detail.open { display: block; }
    
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }
    
    .detail-section h3 {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .1em;
      color: var(--orchid); margin-bottom: .75rem;
    }
    .detail-section p { font-size: .9rem; color: #333; line-height: 1.6; margin-bottom: .25rem; }
    .detail-section .highlight { font-weight: 600; color: var(--burgundy); }
    
    .items-list { margin-top: .5rem; }
    .item-row { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid #f0f0f0; }
    .item-row:last-child { border-bottom: none; }
    
    .order-actions { margin-top: 1rem; display: flex; gap: .5rem; }
    .order-actions button {
      padding: .5rem 1rem; border-radius: 6px; font-size: .8rem; cursor: pointer;
      border: none; font-weight: 500;
    }
    .btn-ship { background: #007bff; color: #fff; }
    .btn-copy { background: #e9ecef; color: #333; }
    
    .empty-state { text-align: center; padding: 4rem 2rem; color: #888; }
    .loading { text-align: center; padding: 2rem; color: #888; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h1>🀄 MAH JOY Admin</h1>
    <div id="login-error" class="login-error">Contraseña incorrecta</div>
    <input type="password" id="password" placeholder="Contraseña" autofocus>
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- Admin Panel -->
<div id="admin-panel">
  <div class="admin-header">
    <h1>🀄 MAH JOY — Panel de Pedidos</h1>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
  
  <div class="admin-content">
    <div class="stats-row">
      <div class="stat-card">
        <div class="label">Pedidos hoy</div>
        <div class="value" id="stat-today">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Pedidos totales</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Pagados</div>
        <div class="value" id="stat-paid">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Por enviar</div>
        <div class="value" id="stat-pending">—</div>
      </div>
    </div>
    
    <div class="orders-section">
      <h2>📦 Todos los pedidos</h2>
      <div id="orders-list" class="loading">Cargando pedidos...</div>
    </div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = 'mahjoy2024'; // Cambiar en producción

function login() {
  const pwd = document.getElementById('password').value;
  if (pwd === ADMIN_PASSWORD) {
    sessionStorage.setItem('mj_admin', 'true');
    showAdmin();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function logout() {
  sessionStorage.removeItem('mj_admin');
  location.reload();
}

function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  loadOrders();
}

async function loadOrders() {
  try {
    const res = await fetch('/api/orders');
    const data = await res.json();
    const orders = data.orders || [];
    
    // Stats
    const today = new Date().toISOString().split('T')[0];
    const todayOrders = orders.filter(o => (o.createdAt || '').startsWith(today));
    const paidOrders = orders.filter(o => o.status === 'paid');
    const pendingShip = paidOrders.filter(o => o.status === 'paid' && !o.tracking_number);
    
    document.getElementById('stat-today').textContent = todayOrders.length;
    document.getElementById('stat-total').textContent = orders.length;
    document.getElementById('stat-paid').textContent = paidOrders.length;
    document.getElementById('stat-pending').textContent = pendingShip.length;
    
    // Render orders
    if (orders.length === 0) {
      document.getElementById('orders-list').innerHTML = '<div class="empty-state">No hay pedidos aún</div>';
      return;
    }
    
    document.getElementById('orders-list').innerHTML = orders.map(renderOrder).join('');
  } catch (err) {
    document.getElementById('orders-list').innerHTML = '<div class="empty-state">Error cargando pedidos</div>';
  }
}

function renderOrder(order) {
  const statusClass = order.status === 'paid' ? 'paid' : order.status === 'shipped' ? 'shipped' : 'pending';
  const statusLabel = order.status === 'paid' ? '✓ Pagado' : order.status === 'shipped' ? '📦 Enviado' : '⏳ Pendiente';
  const date = order.createdAt ? new Date(order.createdAt).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  
  const items = order.cart || order.items || [];
  const shipping = order.shipping || {};
  const shippingCost = order.shipping_cost || shipping.cost || 0;
  const itemsTotal = items.reduce((sum, i) => sum + ((i.price || 0) * (i.qty || 1)), 0);
  const total = order.total || order.amount || (itemsTotal + shippingCost);
  
  // Build shipping address
  const addr = order.shipping_street || shipping.street || '';
  const interior = order.shipping_interior || shipping.neighborhood || '';
  const city = order.shipping_city || shipping.city || '';
  const state = order.shipping_state || shipping.state || '';
  const cp = order.shipping_cp || shipping.cp || '';
  const fullAddress = [addr, interior, `${city}, ${state}`, `CP ${cp}`].filter(Boolean).join('\n');
  
  return `
    <div class="order-card">
      <div class="order-header" onclick="toggleOrder(this)">
        <div>
          <span class="order-id">#${order.orderId || '—'}</span>
          <span class="order-date">${date}</span>
        </div>
        <span class="order-status ${statusClass}">${statusLabel}</span>
      </div>
      <div class="order-detail">
        <div class="detail-grid">
          <div class="detail-section">
            <h3>👤 Cliente</h3>
            <p class="highlight">${order.customer_name || ''} ${order.customer_lastname || ''}</p>
            <p>📧 ${order.customer_email || '—'}</p>
            <p>📱 ${order.customer_phone || '—'}</p>
          </div>
          <div class="detail-section">
            <h3>🏠 Dirección de envío</h3>
            <p style="white-space:pre-line;">${fullAddress || 'No especificada'}</p>
          </div>
        </div>
        
        <div class="detail-section" style="margin-top:1.5rem;">
          <h3>🛒 Productos</h3>
          <div class="items-list">
            ${items.map(i => `
              <div class="item-row">
                <span>${i.name || '—'} × ${i.qty || 1}</span>
                <span>$${((i.price || 0) * (i.qty || 1)).toLocaleString('es-MX')}</span>
              </div>
            `).join('')}
            <div class="item-row">
              <span>📦 Envío</span>
              <span>$${shippingCost.toLocaleString('es-MX')}</span>
            </div>
            <div class="item-row" style="font-weight:700;color:var(--burgundy);">
              <span>Total</span>
              <span>$${total.toLocaleString('es-MX')}</span>
            </div>
          </div>
        </div>
        
        <div class="order-actions">
          <button class="btn-copy" onclick="copyAddress('${order.orderId}', \`${fullAddress.replace(/`/g, "'")}\`)">📋 Copiar dirección</button>
          <button class="btn-ship" onclick="markShipped('${order.orderId}')">📦 Marcar enviado</button>
        </div>
      </div>
    </div>
  `;
}

function toggleOrder(header) {
  const detail = header.nextElementSibling;
  detail.classList.toggle('open');
}

function copyAddress(orderId, address) {
  navigator.clipboard.writeText(address).then(() => {
    alert('Dirección copiada al portapapeles');
  });
}

async function markShipped(orderId) {
  const tracking = prompt('Número de guía (opcional):');
  if (tracking === null) return;
  
  try {
    await fetch(`/api/orders/${orderId}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'shipped', tracking_number: tracking || undefined })
    });
    loadOrders();
    alert('Pedido marcado como enviado');
  } catch (err) {
    alert('Error actualizando pedido');
  }
}

// Check session
document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});

if (sessionStorage.getItem('mj_admin') === 'true') {
  showAdmin();
}
</script>
</body>
</html>
