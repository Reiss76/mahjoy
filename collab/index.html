<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahjoy Colaboradoras</title>
  <meta http-equiv="refresh" content="0; url=https://proax.app/collab/31">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #7B1F1F 0%, #5a1717 100%);
      color: white;
    }
    .loading {
      text-align: center;
    }
    .loading h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <h1>🀄 Mahjoy Colaboradoras</h1>
    <div class="spinner"></div>
    <p style="margin-top:1rem;opacity:0.8">Cargando...</p>
  </div>
  <script>
    // Fallback redirect
    window.location.href = 'https://proax.app/collab/31';
  </script>
</body>
</html>
