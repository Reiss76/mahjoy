    :root { --burgundy:#6B0F2A; --orchid:#C76BA4; --orchid-mid:#9B3E7A; --blush:#F5E8F0; --navy:#1A1034; --cream:#FAF6F0; }
    * { box-sizing:border-box; margin:0; padding:0; }

    .mj-cat-header {
      background-color: var(--navy);
      text-align: center;
      padding: 48px 24px 40px;
      position: relative;
      overflow: hidden;
    }
    .mj-cat-header::before, .mj-cat-header::after {
      content:''; position:absolute; left:0; right:0; height:4px;
      background:linear-gradient(90deg,transparent,var(--orchid),var(--burgundy),var(--orchid),transparent);
    }
    .mj-cat-header::before { top:12px; }
    .mj-cat-header::after { bottom:12px; }
    .mj-cat-header-deco { position:absolute; width:60px; height:60px; border:2px solid rgba(199,107,164,0.35); }
    .mj-cat-header-deco.tl { top:20px;left:20px;border-right:none;border-bottom:none; }
    .mj-cat-header-deco.tr { top:20px;right:20px;border-left:none;border-bottom:none; }
    .mj-cat-header-deco.bl { bottom:20px;left:20px;border-right:none;border-top:none; }
    .mj-cat-header-deco.br { bottom:20px;right:20px;border-left:none;border-top:none; }
    .mj-cat-header-eyebrow { font-family:'Plus Jakarta Sans',sans-serif; font-size:0.65rem; font-weight:700; letter-spacing:0.25em; text-transform:uppercase; color:var(--orchid); margin-bottom:10px; }
    .mj-cat-header-title { font-family:'Playfair Display',serif; font-size:clamp(3rem,10vw,7rem); font-weight:900; font-style:italic; color:var(--cream); line-height:1; }

    /* Filter pills */
    .mj-filter-bar {
      background-color: var(--blush);
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .mj-filter-pill {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 999px;
      border: 1.5px solid var(--burgundy);
      color: var(--burgundy);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mj-filter-pill.active, .mj-filter-pill:hover {
      background: var(--burgundy);
      color: #fff;
    }

    /* Product grid */
    .mj-collection-section {
      background-color: var(--blush);
      padding: 8px 24px 64px;
    }
    #mj-product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .mj-prod-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(107,15,42,0.07);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .mj-prod-card:hover { transform:translateY(-3px); box-shadow:0 8px 28px rgba(107,15,42,0.14); }
    .mj-prod-card-img { width:100%; aspect-ratio:1/1; object-fit:cover; background:#f0e0ea; display:block; }
    .mj-prod-card-img.placeholder { display:flex; align-items:center; justify-content:center; }
    .mj-prod-card-img.placeholder svg { opacity:0.2; }
    .mj-prod-card-body { padding:12px 14px 14px; }
    .mj-prod-card-name { font-family:'Playfair Display',serif; font-size:0.88rem; font-weight:700; color:var(--burgundy); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mj-prod-card-price { font-family:'Plus Jakarta Sans',sans-serif; font-size:0.75rem; font-weight:700; color:var(--orchid); }
    .mj-prod-card-add { width:100%; margin-top:10px; padding:7px; background:var(--burgundy); color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:0.68rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; border:none; border-radius:6px; cursor:pointer; transition:background 0.2s; }
    .mj-prod-card-add:hover { background:var(--orchid-mid); }

    /* Loading / empty */
    #mj-loading { text-align:center; padding:48px; font-family:'Plus Jakarta Sans',sans-serif; color:var(--orchid); font-size:0.9rem; letter-spacing:0.1em; grid-column:1/-1; }

    /* Footer */
    .mj-footer { background-color:var(--burgundy); padding:40px 24px; text-align:center; }
    .mj-footer-logo { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:900; color:#FAF6F0; letter-spacing:0.15em; margin-bottom:16px; }
    .mj-footer-links { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-bottom:20px; }
    .mj-footer-links a { font-family:'Plus Jakarta Sans',sans-serif; font-size:0.75rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:rgba(250,246,240,0.6); text-decoration:none; }
    .mj-footer-links a:hover { color:var(--orchid); }
    .mj-footer-copy { font-family:'Plus Jakarta Sans',sans-serif; font-size:0.7rem; color:rgba(250,246,240,0.35); }

    @media (max-width: 900px) { #mj-product-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width: 640px) { #mj-product-grid { grid-template-columns:repeat(2,1fr); } }
  </style>

  <script>
    const MJ_API = 'https://api-production-b888.up.railway.app';
    const MEDIA  = MJ_API + '/public/media?key=';

    function matchCat(sku, cat) {
      if (!sku) return false;
      const s = sku.toUpperCase();
      if (cat === 'mats') return s.startsWith('MAT-');
      if (cat === 'tiles') return s.startsWith('TILE-');
      if (cat === 'racks') return s.startsWith('RACK-') && !s.startsWith('RAKBAG-');
      if (cat === 'bags') return s.startsWith('BAG-') || s.startsWith('RAKBAG-');
      if (cat === 'accessories') return !['MAT-','TILE-','RACK-','BAG-','RAKBAG-','SHUF-','LINE-'].some(p => s.startsWith(p));
      return true;
    }

    function imgUrl(product) {
      const urls = [product.primary_image_url, ...(product.published_image_urls||[]), ...(product.images||[])].filter(Boolean);
      if (urls && urls.length > 0) {
        let key = urls[0];
        if (key.startsWith('/api/public/media')) key = key.replace('/api/public/media', '/public/media');
        if (key.startsWith('/public/media')) return MJ_API + key;
        if (!key.startsWith('http')) return MEDIA + encodeURIComponent(key);
        return key;
      }
      return null;
    }

    let allProducts = [];
    let activeCat = 'all';

    function renderGrid(products) {
      const grid = document.getElementById('mj-product-grid');
      grid.innerHTML = '';
      if (!products.length) {
        grid.innerHTML = '<div id="mj-loading">Sin productos en esta categoría.</div>';
        return;
      }
      products.forEach(p => {
        const img = imgUrl(p);
        const price = p.sale_price ? '$' + Number(p.sale_price).toFixed(2) : (p.cost ? '$' + Number(p.cost).toFixed(2) : '');
        const card = document.createElement('div');
        card.className = 'mj-prod-card';
        card.innerHTML = `
          ${img
            ? `<img src="${img}" alt="${p.name}" class="mj-prod-card-img" onerror="this.style.display='none'">`
            : `<div class="mj-prod-card-img placeholder" style="background:#f0e0ea;height:200px;display:flex;align-items:center;justify-content:center;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C76BA4" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg></div>`
          }
          <div class="mj-prod-card-body">
            <div class="mj-prod-card-name" title="${p.name}">${p.name}</div>
            <div class="mj-prod-card-price">${price}</div>
            <button class="mj-prod-card-add" onclick="addToCart(${JSON.stringify(p).split('"').join('&quot;')})">+ Add</button>
          </div>`;
        card.querySelector('.mj-prod-card-img, .mj-prod-card-img.placeholder') && (card.onclick = function(e){
          if (!e.target.classList.contains('mj-prod-card-add')) {
            window.location.href = 'product.html#' + p.id;
          }
        });
        grid.appendChild(card);
      });
    }

    function addToCart(p) {
      if (window.MJCart) {
        const item = { 
          id: p.id, 
          sku: p.sku,
          name: p.name, 
          price: parseFloat(p.price_usd || p.price || 0), 
          image: imgUrl(p) 
        };
        window.MJCart.addToCart(item);
        updateCartBadge();
      }
    }
    
    function updateCartBadge() {
      const count = window.MJCart ? window.MJCart.cartCount() : 0;
      const badge = document.getElementById('header-cart-badge');
      const menuBadges = document.querySelectorAll('.mj-cart-badge');
      if (badge) {
        badge.textContent = count;
        badge.style.display = count > 0 ? 'block' : 'none';
      }
      menuBadges.forEach(b => {
        b.textContent = count;
        b.style.display = count > 0 ? 'flex' : 'none';
      });
    }
    
    // Update badge on page load
    document.addEventListener('DOMContentLoaded', updateCartBadge);

    document.querySelectorAll('.mj-filter-pill').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.mj-filter-pill').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeCat = this.dataset.cat;
        const filtered = activeCat === 'all' ? allProducts : allProducts.filter(p => matchCat(p.sku, activeCat));
        renderGrid(filtered);
      });
    });

    fetch(MJ_API + '/public/shop/mahjoy/products')
      .then(r => r.json())
      .then(data => {
        allProducts = data.products || data || [];
        renderGrid(allProducts);
      })
      .catch(() => {
        document.getElementById('mj-loading').textContent = 'Error loading products.';
      });

    // Nav hamburger
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.querySelector('.w-nav-button');
      var menu = document.querySelector('.nav-menu');
      var overlay = document.querySelector('.overlay-menu');
      if (!btn || !menu) return;
      function closeNav() { menu.classList.remove('w--nav-menu-open'); btn.classList.remove('w--open'); document.body.classList.remove('w-nav-open'); if (overlay) overlay.style.display='none'; }
      btn.addEventListener('click', function(e) { e.stopPropagation(); var isOpen=btn.classList.contains('w--open'); if(isOpen){closeNav();}else{menu.classList.add('w--nav-menu-open');menu.style.display='flex';btn.classList.add('w--open');document.body.classList.add('w-nav-open');if(overlay)overlay.style.display='block';} });
      if (overlay) overlay.addEventListener('click', closeNav);
      document.addEventListener('click', function(e) { if(!menu.contains(e.target)&&!btn.contains(e.target))closeNav(); });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded",function(){
      var btn=document.querySelector(".w-nav-button"),menu=document.querySelector(".nav-menu"),overlay=document.querySelector(".overlay-menu");
      if(!btn||!menu)return;
      function closeNav(){document.body.classList.remove("mj-nav-open","w-nav-open");btn.classList.remove("w--open");menu.style.display="";}
      btn.addEventListener("click",function(e){e.stopPropagation();if(document.body.classList.contains("mj-nav-open")){closeNav();}else{document.body.classList.add("mj-nav-open","w-nav-open");btn.classList.add("w--open");}});
      if(overlay)overlay.addEventListener("click",closeNav);
      document.addEventListener("click",function(e){if(menu.contains(e.target)||btn.contains(e.target))return;closeNav();});
    });
  </script>
  <script>
    (function(){
      // Inject cart icon + hamburger into cell-menu
      var cellMenu = document.querySelector('.cell-menu');
      if(cellMenu){
        cellMenu.style.cssText = 'display:flex;align-items:center;justify-content:flex-end;gap:8px;';cellMenu.innerHTML = '<a href="cart.html" id="header-cart" style="position:relative;display:flex;align-items:center;padding:8px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FAF6F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span id="header-cart-badge" style="display:none;position:absolute;top:0;right:0;background:var(--orchid);color:#fff;font-family:Plus Jakarta Sans,sans-serif;font-size:.55rem;font-weight:800;min-width:16px;height:16px;border-radius:50%;text-align:center;line-height:16px;">0</span></a><button id="mj-ham" style="background:none;border:none;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;width:48px;height:48px;" aria-label="Menu"><span style="display:block;width:22px;height:2px;background:var(--orchid,#C76BA4);border-radius:2px;"></span><span style="display:block;width:22px;height:2px;background:var(--orchid,#C76BA4);border-radius:2px;"></span><span style="display:block;width:22px;height:2px;background:var(--orchid,#C76BA4);border-radius:2px;"></span></button>';
      }
      var btn=document.getElementById('mj-ham');
      var menu=document.querySelector('.nav-menu');
      var overlay=document.querySelector('.overlay-menu');
      if(!btn||!menu)return;
      function closeNav(){document.body.classList.remove('mj-nav-open','w-nav-open');menu.classList.remove('w--nav-menu-open');menu.style.display='';}
      btn.addEventListener('click',function(e){e.stopPropagation();document.body.classList.contains('mj-nav-open')?closeNav():(document.body.classList.add('mj-nav-open','w-nav-open'),menu.classList.add('w--nav-menu-open'),menu.style.display='');});
      if(overlay)overlay.addEventListener('click',closeNav);
      document.addEventListener('click',function(e){if(menu.contains(e.target)||btn.contains(e.target))return;closeNav();});
    })();
  </script>
