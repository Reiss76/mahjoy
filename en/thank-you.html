<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thank You for Your Purchase! — MAH JOY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="../images/icon-burgundy.svg" type="image/svg+xml">
  <style>
    :root {
      --burgundy: #6B0F2A;
      --orchid: #C76BA4;
      --blush: #F5E8F0;
      --cream: #FAF6F0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, var(--blush) 0%, var(--cream) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(107, 15, 42, 0.15);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      font-style: italic;
      color: var(--burgundy);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 1rem;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .order-box {
      background: var(--blush);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .order-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--orchid);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .order-id {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--burgundy);
      word-break: break-all;
    }
    .steps {
      text-align: left;
      margin-bottom: 28px;
    }
    .steps h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--burgundy);
      margin-bottom: 12px;
    }
    .steps ul {
      list-style: none;
      padding: 0;
    }
    .steps li {
      padding: 8px 0;
      padding-left: 28px;
      position: relative;
      font-size: 0.9rem;
      color: #444;
      line-height: 1.5;
    }
    .steps li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--orchid);
      font-weight: bold;
    }
    .btn {
      display: inline-block;
      background: var(--burgundy);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--orchid);
    }
    .footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #999;
    }
    .footer a {
      color: var(--orchid);
    }
    .logo {
      margin-bottom: 24px;
    }
    .logo img {
      height: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <a href="index.html"><img src="../images/logo-burgundy.svg" alt="MAH JOY" onerror="this.outerHTML='<span style=\'font-family:Playfair Display,serif;font-size:1.5rem;font-weight:900;color:var(--burgundy);\'>MAH JOY</span>'"></a>
    </div>
    <div class="icon">🎉</div>
    <h1>Thank You!</h1>
    <p class="subtitle">Your order has been confirmed. Thank you for choosing us!</p>
    
    <div class="order-box">
      <div class="order-label">Order Number</div>
      <div class="order-id" id="order-id">—</div>
    </div>
    
    <div class="steps">
      <h3>What's next?</h3>
      <ul>
        <li>We'll prepare your order with love</li>
        <li>We'll contact you via WhatsApp with updates</li>
        <li>Enjoy playing Mahjong! 🀄</li>
      </ul>
    </div>
    
    <a href="index.html" class="btn">Back to Home</a>
    
    <div class="footer">
      Questions? <a href="https://wa.me/525530395891">Message us on WhatsApp</a>
    </div>
  </div>
  
  <script>
    // Get order ID from URL
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order');
    if (orderId) {
      document.getElementById('order-id').textContent = orderId;
    }
  </script>
</body>
</html>
