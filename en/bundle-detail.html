<head>

  <meta charset="utf-8">

  <link href="../css/webflow.css" rel="stylesheet">

  <link href="../images/icon-burgundy.svg" rel="shortcut icon" type="image/svg+xml">
  <style>
    :root{--burgundy:#6B0F2A;--orchid:#C76BA4;--orchid-mid:#9B3E7A;--blush:#F5E8F0;--navy:#1A1034;--cream:#FAF6F0;}
    *{box-sizing:border-box;}
    
    .mj-bundle-page{background:var(--blush);min-height:100vh;padding-bottom:80px;}
    .mj-bundle-hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;max-width:1200px;margin:0 auto;padding:48px 24px;}
    .mj-bundle-img{width:100%;border-radius:16px;box-shadow:0 8px 32px rgba(107,15,42,.12);}
    .mj-bundle-info{display:flex;flex-direction:column;justify-content:center;}
    .mj-bundle-eyebrow{font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--orchid);margin-bottom:8px;}
    .mj-bundle-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:900;color:var(--burgundy);line-height:1.1;margin-bottom:16px;}
    .mj-bundle-desc{font-family:'Plus Jakarta Sans',sans-serif;font-size:.9rem;color:#555;line-height:1.6;margin-bottom:24px;}
    
    .mj-bundle-pricing{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:24px;box-shadow:0 2px 12px rgba(107,15,42,.06);}
    .mj-bundle-original{font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;color:#888;text-decoration:line-through;margin-bottom:4px;}
    .mj-bundle-price{font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:900;color:var(--burgundy);}
    .mj-bundle-savings{display:inline-block;background:#dcfce7;color:#16a34a;font-family:'Plus Jakarta Sans',sans-serif;font-size:.75rem;font-weight:700;padding:6px 12px;border-radius:999px;margin-top:8px;}
    
    .mj-bundle-cta{display:flex;gap:12px;margin-bottom:32px;}
    .mj-bundle-btn{flex:1;padding:16px 24px;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;transition:all .2s;border:none;text-decoration:none;}
    .mj-bundle-btn-primary{background:var(--burgundy);color:#fff;}
    .mj-bundle-btn-primary:hover{background:var(--orchid-mid);}
    .mj-bundle-btn-secondary{background:transparent;color:var(--burgundy);border:2px solid var(--burgundy);}
    .mj-bundle-btn-secondary:hover{background:var(--burgundy);color:#fff;}
    
    .mj-bundle-products{margin-top:32px;}
    .mj-bundle-products-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--orchid);margin-bottom:16px;}
    .mj-bundle-product{display:flex;align-items:center;gap:16px;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(107,15,42,.04);}
    .mj-bundle-product-img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#f5e8f0;}
    .mj-bundle-product-info{flex:1;}
    .mj-bundle-product-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;font-weight:600;color:var(--burgundy);}
    .mj-bundle-product-qty{font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;color:#888;}
    .mj-bundle-product-price{font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;font-weight:700;color:var(--orchid);}
    
    @media(max-width:768px){
      .mj-bundle-hero{grid-template-columns:1fr;gap:24px;padding:24px 16px;}
      .mj-bundle-cta{flex-direction:column;}
    }
    
    .mj-footer{background-color:var(--burgundy);padding:40px 24px;text-align:center;}
    .mj-footer-logo img{height:60px;width:auto;mix-blend-mode:screen;display:block;margin:0 auto;}
    .mj-footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:16px 0;}
    .mj-footer-links a{font-family:'Plus Jakarta Sans',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(250,246,240,.6);text-decoration:none;}
    .mj-footer-links a:hover{color:var(--orchid);}
    .mj-footer-copy{font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;color:rgba(250,246,240,.35);}
    
    .mj-loading{text-align:center;padding:80px 24px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--orchid);}
  </style>
</head>
<body>
  <!-- NAV -->
  <div class="nav-bar" style="background-color:var(--burgundy)">
    <div data-animation="over-right" class="navmenu w-nav" role="banner" data-collapse="all" data-no-scroll="1" data-duration="0">
      <div class="w-layout-layout quick-stack wf-layout-layout">
        <div class="w-layout-cell cell-slogan"><div></div></div>
        <div class="w-layout-cell cell-brand"><a href="index.html" class="brand w-nav-brand"><img src="../images/logo-mahjoy-horizontal.png" alt="MAH JOY" class="brand-logo"></a></div>
        <div class="w-layout-cell cell-menu"><div class="menu-button-wrapper"><div class="menu-button w-nav-button"><div class="dot-menu-button"></div></div></div></div>
      </div>
      <div class="nav-menu">
        <a href="cart.html" class="nav-link w-inline-block mj-cart-nav" style="position:relative;"><div class="nav-link-text" style="display:flex;align-items:center;gap:.4rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Cart</div><span class="mj-cart-badge" style="display:none;position:absolute;top:-4px;right:-8px;background:var(--orchid);color:#fff;font-size:.6rem;font-weight:800;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;">0</span></a>
        <a href="index.html" class="nav-link w-inline-block"><div class="nav-link-text">Home</div></a>
        <a href="shop-bundles.html" class="nav-link w-inline-block"><div class="nav-link-text" style="color:var(--orchid)">Bundles ✦</div></a>
        <a href="works.html" class="nav-link w-inline-block"><div class="nav-link-text">Collection</div></a>
        <a href="about.html" class="nav-link w-inline-block"><div class="nav-link-text">About</div></a>
        <a href="contact.html" class="nav-link w-inline-block"><div class="nav-link-text">Contact</div></a>
      </div>
      <div class="overlay-menu"></div>
    </div>
  </div>

  <div class="mj-bundle-page">
    <div id="bundle-content" class="mj-loading">
      <p>Loading bundle...</p>
    </div>
  </div>

  <footer class="mj-footer">
    <div class="mj-footer-logo"><img src="../images/logo-mahjoy-horizontal.png" alt="MAH JOY"></div>
    <nav class="mj-footer-links"><a href="works.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
    <p class="mj-footer-copy">© 2025 MAH JOY — Think. Play. Mahjong.</p>
  </footer>

  <script src="../js/webflow.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    const MJ_API = 'https://api-production-b888.up.railway.app';
    
    function fmtPrice(price) {
      const num = parseFloat(price || 0);
      if (!num) return 'Contact for price';
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
    }
    
    async function loadBundle() {
      const params = new URLSearchParams(window.location.search);
      const bundleId = params.get('id');
      
      if (!bundleId) {
        document.getElementById('bundle-content').innerHTML = '<p>Bundle not found</p>';
        return;
      }
      
      try {
        const res = await fetch(MJ_API + '/public/shop/mahjoy/bundles');
        const data = await res.json();
        const bundles = data.bundles || [];
        const bundle = bundles.find(b => b.id == bundleId);
        
        if (!bundle) {
          document.getElementById('bundle-content').innerHTML = '<p>Bundle not found</p>';
          return;
        }
        
        // Calculate totals using USD prices
        let originalTotal = 0;
        if (bundle.products) {
          bundle.products.forEach(p => {
            originalTotal += parseFloat(p.price_usd || 0) * (p.quantity || 1);
          });
        }
        const bundlePrice = parseFloat(bundle.price_usd || 0);
        const savings = originalTotal > bundlePrice ? originalTotal - bundlePrice : 0;
        
        // Build products HTML
        let productsHtml = '';
        if (bundle.products) {
          bundle.products.forEach(p => {
            const qty = p.quantity || 1;
            const lineTotal = parseFloat(p.price_usd || 0) * qty;
            productsHtml += `
              <div class="mj-bundle-product">
                <div class="mj-bundle-product-img" style="background:#f5e8f0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--orchid);">✦</div>
                <div class="mj-bundle-product-info">
                  <div class="mj-bundle-product-name">${p.name}</div>
                  <div class="mj-bundle-product-qty">${qty > 1 ? qty + '× ' : ''}${p.sku}</div>
                </div>
                <div class="mj-bundle-product-price">${fmtPrice(lineTotal)}</div>
              </div>
            `;
          });
        }
        
        document.getElementById('bundle-content').innerHTML = `
          <div class="mj-bundle-hero">
            <div>
              <img src="${bundle.image || '../images/bundles/bundle-placeholder.jpg'}" alt="${bundle.name}" class="mj-bundle-img">
            </div>
            <div class="mj-bundle-info">
              <p class="mj-bundle-eyebrow">✦ Complete Bundle ✦</p>
              <h1 class="mj-bundle-title">${bundle.name}</h1>
              <p class="mj-bundle-desc">${bundle.description || 'Complete set with everything you need to play Mahjong in style.'}</p>
              
              <div class="mj-bundle-pricing">
                ${originalTotal > bundlePrice ? `<div class="mj-bundle-original">Individual value: ${fmtPrice(originalTotal)}</div>` : ''}
                <div class="mj-bundle-price">${fmtPrice(bundlePrice)}</div>
                ${savings > 0 ? `<span class="mj-bundle-savings">Save ${fmtPrice(savings)}</span>` : ''}
              </div>
              
              <div class="mj-bundle-cta">
                <button class="mj-bundle-btn mj-bundle-btn-primary" onclick="buyBundle(${JSON.stringify(bundle).replace(/"/g, '&quot;')})">
                  Buy Bundle →
                </button>
                <a href="shop-bundles.html" class="mj-bundle-btn mj-bundle-btn-secondary">
                  ← View All
                </a>
              </div>
              
              <div class="mj-bundle-products">
                <p class="mj-bundle-products-title">✦ ${bundle.products ? bundle.products.length : 0} Products Included ✦</p>
                ${productsHtml}
              </div>
            </div>
          </div>
        `;
        
        document.title = bundle.name + ' — MAH JOY';
        
      } catch (err) {
        console.error('Error:', err);
        document.getElementById('bundle-content').innerHTML = '<p>Error loading bundle</p>';
      }
    }
    
    function buyBundle(bundle) {
      // Add bundle to cart as single item
      const cart = JSON.parse(localStorage.getItem('mj_cart') || '[]');
      const existingIdx = cart.findIndex(i => i.sku === bundle.sku);
      
      if (existingIdx >= 0) {
        cart[existingIdx].qty += 1;
      } else {
        cart.push({
          id: 'bundle-' + bundle.id,
          sku: bundle.sku,
          name: bundle.name,
          price: parseFloat(bundle.price_usd) || 0,
          image: bundle.image || null,
          qty: 1,
          isBundle: true
        });
      }
      
      localStorage.setItem('mj_cart', JSON.stringify(cart));
      
      // Update badge
      const total = cart.reduce((a, i) => a + i.qty, 0);
      document.querySelectorAll('.mj-cart-badge').forEach(el => {
        el.textContent = total;
        el.style.display = total > 0 ? 'flex' : 'none';
      });
      
      // Redirect to checkout
      window.location.href = 'checkout.html?bundle=' + bundle.id;
    }
    
    loadBundle();
  </script>
  <script src="../js/mobile-nav.js"></script>
<script>(function(){function updateCartBadge(){var count=window.MJCart?window.MJCart.cartCount():0;var badge=document.getElementById("header-cart-badge");var menuBadges=document.querySelectorAll(".mj-cart-badge");if(badge){badge.textContent=count;badge.style.display=count>0?"block":"none";}menuBadges.forEach(function(b){b.textContent=count;b.style.display=count>0?"flex":"none";});}document.addEventListener("DOMContentLoaded",updateCartBadge);window.updateCartBadge=updateCartBadge;})();</script></body>
</html>
