<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>My Orders — MAH JOY</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="css/normalize.css" rel="stylesheet">
  <link href="css/webflow.css" rel="stylesheet">
  <link href="css/mahjoy.webflow.css" rel="stylesheet">
  <link href="css/mahjoy-brand.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="images/icon-burgundy.svg" rel="shortcut icon" type="image/svg+xml">
  <style>
    :root { --burgundy: #6B0F2A; --orchid: #C76BA4; --blush: #F5E8F0; }
    .mj-orders-wrap { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .mj-orders-title { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--burgundy); text-align: center; margin-bottom: 2rem; }
    
    /* Email lookup */
    .mj-lookup-box { background: #fff; border: 2px solid #f0e4ec; border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
    .mj-lookup-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: .9rem; color: #666; margin-bottom: 1rem; }
    .mj-lookup-form { display: flex; gap: .75rem; flex-wrap: wrap; }
    .mj-lookup-input { flex: 1; min-width: 200px; padding: .8rem 1rem; border: 2px solid #f0e4ec; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: .9rem; }
    .mj-lookup-input:focus { outline: none; border-color: var(--orchid); }
    .mj-lookup-btn { background: var(--burgundy); color: #fff; border: none; padding: .8rem 1.5rem; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: .85rem; cursor: pointer; transition: background .2s; }
    .mj-lookup-btn:hover { background: var(--orchid); }
    
    /* Order card */
    .mj-order-card { background: #fff; border: 2px solid #f0e4ec; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
    .mj-order-card:hover { border-color: var(--orchid); box-shadow: 0 4px 20px rgba(107,15,42,.1); }
    .mj-order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: .5rem; }
    .mj-order-id { font-family: 'Plus Jakarta Sans', sans-serif; font-size: .75rem; color: #999; letter-spacing: .08em; text-transform: uppercase; }
    .mj-order-date { font-family: 'Plus Jakarta Sans', sans-serif; font-size: .85rem; color: #666; }
    .mj-order-status { display: inline-flex; align-items: center; gap: .4rem; padding: .4rem .8rem; border-radius: 999px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: .04em; }
    .mj-order-status.pending { background: #fff3e0; color: #ef6c00; }
    .mj-order-status.paid { background: #e8f5e9; color: #2e7d32; }
    .mj-order-status.shipped { background: #e3f2fd; color: #1565c0; }
    .mj-order-status.delivered { background: #f3e5f5; color: #7b1fa2; }
    
    /* Timeline */
    .mj-timeline { display: flex; justify-content: space-between; margin: 1.5rem 0; position: relative; }
    .mj-timeline::before { content: ''; position: absolute; top: 16px; left: 10%; right: 10%; height: 3px; background: #e0e0e0; z-index: 0; }
    .mj-timeline-step { display: flex; flex-direction: column; align-items: center; z-index: 1; flex: 1; }
    .mj-timeline-dot { width: 32px; height: 32px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 14px; margin-bottom: .5rem; transition: all .3s; }
    .mj-timeline-dot.active { background: var(--burgundy); color: #fff; }
    .mj-timeline-dot.completed { background: #4caf50; color: #fff; }
    .mj-timeline-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: .65rem; color: #999; text-align: center; max-width: 70px; }
    .mj-timeline-label.active { color: var(--burgundy); font-weight: 600; }
    
    /* Tracking box */
    .mj-tracking-box { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); padding: 1rem 1.25rem; border-radius: 12px; margin-top: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .mj-tracking-info { font-family: 'Plus Jakarta Sans', sans-serif; font-size: .85rem; color: #2e7d32; }
    .mj-tracking-link { background: #2e7d32; color: #fff; text-decoration: none; padding: .5rem 1rem; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: .8rem; font-weight: 600; transition: background .2s; }
    .mj-tracking-link:hover { background: #1b5e20; }
    
    /* Order detail */
    .mj-order-detail { display: none; }
    .mj-order-detail.open { display: block; }
    .mj-order-items { border-top: 1px solid #f0e4ec; padding-top: 1rem; margin-top: 1rem; }
    .mj-order-item { display: flex; justify-content: space-between; font-family: 'Plus Jakarta Sans', sans-serif; font-size: .9rem; color: #333; padding: .5rem 0; }
    .mj-order-item-name { flex: 1; }
    .mj-order-item-qty { color: #999; margin-right: 1rem; }
    .mj-order-item-price { font-weight: 600; color: var(--burgundy); }
    .mj-order-total { border-top: 2px solid var(--burgundy); padding-top: 1rem; margin-top: 1rem; display: flex; justify-content: space-between; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--burgundy); }
    .mj-order-shipping { background: var(--blush); padding: 1rem; border-radius: 8px; margin-top: 1rem; font-family: 'Plus Jakarta Sans', sans-serif; font-size: .85rem; color: #666; }
    .mj-order-shipping strong { color: var(--burgundy); }
    
    /* Empty state */
    .mj-orders-empty { text-align: center; padding: 4rem 2rem; }
    .mj-orders-empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: .5; }
    .mj-orders-empty-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; color: #999; margin-bottom: 2rem; }
    .mj-orders-cta { display: inline-block; background: var(--burgundy); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; padding: 1rem 2rem; border-radius: 999px; text-decoration: none; }
    
    /* Loading */
    .mj-loading { text-align: center; padding: 3rem; color: #999; font-family: 'Plus Jakarta Sans', sans-serif; }
    .mj-loading::after { content: ''; display: inline-block; width: 20px; height: 20px; border: 2px solid var(--orchid); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin-left: .5rem; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="js/geo-redirect.js"></script>
</head>
<body>
  <!-- Navigation -->
  <nav style="background:var(--burgundy);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;">
    <a href="../index.html" style="color:#fff;text-decoration:none;font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;">MAH JOY</a>
    <div style="display:flex;gap:1.5rem;">
      <a href="shop.html" style="color:#fff;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;">Shop</a>
      <a href="cart.html" style="color:#fff;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;">Cart</a>
    </div>
  </nav>

  <div class="mj-orders-wrap">
    <h1 class="mj-orders-title">My Orders</h1>
    
    <!-- Email lookup form -->
    <div class="mj-lookup-box">
      <p class="mj-lookup-text">Enter your email to check your order status:</p>
      <form id="lookup-form" class="mj-lookup-form">
        <input type="email" id="lookup-email" placeholder="your@email.com" required class="mj-lookup-input">
        <button type="submit" class="mj-lookup-btn">Search</button>
      </form>
    </div>
    
    <div id="orders-list"></div>
  </div>

  <script>
    const PROAX_API = 'https://proax.app/api/public/mahjoy';
    
    // Timeline steps configuration
    const TIMELINE_STEPS = [
      { key: 'received', label: 'Order received', icon: '📋' },
      { key: 'paid', label: 'Payment confirmed', icon: '✓' },
      { key: 'shipped', label: 'Shipped', icon: '📦' },
      { key: 'delivered', label: 'Delivered', icon: '🎉' }
    ];
    
    function formatDate(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      return d.toLocaleDateString('es-MX', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    
    function formatPrice(p) {
      return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(p || 0);
    }
    
    function getStatusClass(status) {
      const map = { pending: 'pending', paid: 'paid', shipped: 'shipped', delivered: 'delivered', completed: 'delivered' };
      return map[status] || 'pending';
    }
    
    function getCurrentStep(timeline) {
      if (!timeline || !timeline.length) return 0;
      // Find the last completed step
      for (let i = timeline.length - 1; i >= 0; i--) {
        if (timeline[i].completed) return i;
      }
      return 0;
    }
    
    function renderTimeline(timeline, currentStep) {
      // Use API timeline if available, otherwise create default
      const steps = timeline && timeline.length ? timeline : TIMELINE_STEPS.map((s, i) => ({
        ...s,
        completed: i <= currentStep
      }));
      
      return `
        <div class="mj-timeline">
          ${steps.map((step, i) => {
            const isCompleted = step.completed;
            const isCurrent = i === currentStep;
            const dotClass = isCompleted ? 'completed' : (isCurrent ? 'active' : '');
            const labelClass = isCompleted || isCurrent ? 'active' : '';
            return `
              <div class="mj-timeline-step">
                <div class="mj-timeline-dot ${dotClass}">${step.icon || (isCompleted ? '✓' : i + 1)}</div>
                <span class="mj-timeline-label ${labelClass}">${step.label}</span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }
    
    function renderOrder(order, expanded = false) {
      const statusLabel = order.status_label || order.status || 'Pendiente';
      const statusEmoji = order.status_emoji || '';
      const statusClass = getStatusClass(order.status);
      const timeline = order.timeline || [];
      const currentStep = getCurrentStep(timeline) || (['pending','received'].includes(order.status) ? 0 : ['paid'].includes(order.status) ? 1 : ['shipped'].includes(order.status) ? 2 : 3);
      
      return `
        <div class="mj-order-card" onclick="toggleOrder(this)">
          <div class="mj-order-header">
            <div>
              <div class="mj-order-id">Pedido #${order.orderId || order.order_id || order.id || '—'}</div>
              <div class="mj-order-date">${formatDate(order.createdAt || order.timestamp)}</div>
            </div>
            <span class="mj-order-status ${statusClass}">${statusEmoji} ${statusLabel}</span>
          </div>
          
          ${renderTimeline(timeline, currentStep)}
          
          ${order.tracking_number || order.trackingNumber ? `
            <div class="mj-tracking-box">
              <div class="mj-tracking-info">
                📦 <strong>Tracking:</strong> ${order.tracking_number || order.trackingNumber}
              </div>
              ${order.tracking_url || order.trackingUrl ? `
                <a href="${order.tracking_url || order.trackingUrl}" target="_blank" class="mj-tracking-link">
                  Track shipment →
                </a>
              ` : ''}
            </div>
          ` : ''}
          
          <div class="mj-order-detail ${expanded ? 'open' : ''}">
            <div class="mj-order-items">
              ${(order.items || order.cart || []).map(item => `
                <div class="mj-order-item">
                  <span class="mj-order-item-name">${item.name || item.product_name || '—'}</span>
                  <span class="mj-order-item-qty">x${item.qty || item.quantity || 1}</span>
                  <span class="mj-order-item-price">${formatPrice((item.price || item.unit_price || 0) * (item.qty || item.quantity || 1))}</span>
                </div>
              `).join('')}
            </div>
            
            <div class="mj-order-total">
              <span>Total</span>
              <span>${formatPrice(order.total || order.amount)}</span>
            </div>
            
            ${order.shipping || order.shipping_address ? `
              <div class="mj-order-shipping">
                <strong>Shipping:</strong> ${(order.shipping || order.shipping_address).name || ''}, 
                ${(order.shipping || order.shipping_address).street || ''}, 
                ${(order.shipping || order.shipping_address).neighborhood || ''}, 
                CP ${(order.shipping || order.shipping_address).cp || (order.shipping || order.shipping_address).postalCode || ''}, 
                ${(order.shipping || order.shipping_address).city || ''}, 
                ${(order.shipping || order.shipping_address).state || ''}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }
    
    function toggleOrder(card) {
      const detail = card.querySelector('.mj-order-detail');
      if (detail) {
        detail.classList.toggle('open');
      }
    }
    
    function renderOrders(orders) {
      const container = document.getElementById('orders-list');
      
      if (!orders || !orders.length) {
        container.innerHTML = `
          <div class="mj-orders-empty">
            <div class="mj-orders-empty-icon">📦</div>
            <p class="mj-orders-empty-text">No orders found for this email</p>
            <a href="shop.html" class="mj-orders-cta">Go to shop</a>
          </div>
        `;
        return;
      }
      
      // Sort by date, most recent first
      orders.sort((a, b) => {
        const dateA = new Date(b.createdAt || b.timestamp || 0).getTime();
        const dateB = new Date(a.createdAt || a.timestamp || 0).getTime();
        return dateA - dateB;
      });
      
      container.innerHTML = orders.map((order, i) => renderOrder(order, i === 0)).join('');
    }
    
    async function fetchOrdersByEmail(email) {
      const container = document.getElementById('orders-list');
      container.innerHTML = '<div class="mj-loading">Searching orders</div>';
      
      try {
        // Fetch from Proax API
        const res = await fetch(`${PROAX_API}/orders?email=${encodeURIComponent(email)}`);
        
        if (!res.ok) {
          throw new Error('API error');
        }
        
        const data = await res.json();
        const orders = data.orders || data || [];
        
        // Save email for future visits
        localStorage.setItem('mj_orders_email', email);
        
        renderOrders(orders);
      } catch (err) {
        console.error('Error fetching orders:', err);
        
        // Fallback: try localStorage
        const localOrders = JSON.parse(localStorage.getItem('mj_orders') || '[]');
        const filtered = localOrders.filter(o => 
          o.customer?.email?.toLowerCase() === email.toLowerCase()
        );
        
        if (filtered.length) {
          renderOrders(filtered);
        } else {
          container.innerHTML = `
            <div class="mj-orders-empty">
              <div class="mj-orders-empty-icon">😕</div>
              <p class="mj-orders-empty-text">Could not connect to server. Try again.</p>
              <button onclick="fetchOrdersByEmail('${email}')" class="mj-orders-cta" style="border:none;cursor:pointer;">Retry</button>
            </div>
          `;
        }
      }
    }
    
    async function fetchOrderById(orderId) {
      try {
        const res = await fetch(`${PROAX_API}/orders/${encodeURIComponent(orderId)}`);
        if (res.ok) {
          return await res.json();
        }
      } catch (err) {
        console.error('Error fetching order:', err);
      }
      return null;
    }
    
    // Form handler
    document.getElementById('lookup-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('lookup-email').value.trim();
      if (email) {
        fetchOrdersByEmail(email);
      }
    });
    
    // Check URL params for order ID
    const urlParams = new URLSearchParams(window.location.search);
    const orderIdParam = urlParams.get('order') || urlParams.get('orderId');
    
    if (orderIdParam) {
      // Show specific order
      (async () => {
        const container = document.getElementById('orders-list');
        container.innerHTML = '<div class="mj-loading">Loading order</div>';
        
        const order = await fetchOrderById(orderIdParam);
        if (order) {
          renderOrders([order]);
        } else {
          // Check localStorage
          const localOrders = JSON.parse(localStorage.getItem('mj_orders') || '[]');
          const found = localOrders.find(o => o.orderId === orderIdParam);
          if (found) {
            renderOrders([found]);
          } else {
            container.innerHTML = `
              <div class="mj-orders-empty">
                <div class="mj-orders-empty-icon">🔍</div>
                <p class="mj-orders-empty-text">Order not found #${orderIdParam}</p>
                <p class="mj-lookup-text">Try searching with your email:</p>
              </div>
            `;
          }
        }
      })();
    } else {
      // Check for saved email
      const savedEmail = localStorage.getItem('mj_orders_email');
      if (savedEmail) {
        document.getElementById('lookup-email').value = savedEmail;
        fetchOrdersByEmail(savedEmail);
      }
    }
  </script>
  
  <script src="js/mobile-nav.js"></script>
</body>
</html>
